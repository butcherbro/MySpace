[package]
name = "myspace"
version = "0.2.2"
description = "A spatial project surface"
authors = ["you"]
edition = "2021"
default-run = "myspace"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "myspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
uuid = { version = "1.26.0", features = ["v7", "serde", "rng-getrandom"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-dialog = "2"
# In-app updates (signed, from the public MySpace-releases repo) and the
# relaunch after installing one. Registered only in `run()`, never in tests.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.13.4", features = ["blocking"] }
url = "2.5.8"
# GFM-таблицы для рендера .md-превью (file card) в HTML внутри sandboxed iframe.
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
# Only the pieces the Workspace handle needs: oneshot replies from the writer
# thread and spawn_blocking for pooled reads. Tauri already pulls tokio in.
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "net", "time", "io-util"] }
# Content hash of every managed asset (P1.2, ADR-0011 §4: blob identity).
sha2 = "0.11"
# Canonical paths without the Windows `\\?\` verbatim prefix for the path
# folder locator (already in the tree via tauri-plugin-opener).
dunce = "1"
# Default device name (ADR-0012). Apache-2.0; already in the tree via arboard.
gethostname = "1"
machine-uid = "0.6"
# LAN sync transport (ADR-0011 S3). rustls, tokio-rustls, hyper, hyper-util
# and http-body-util are already in the tree through reqwest; listed to enable
# the server half. aws-lc-rs is the provider reqwest already uses.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Self-signed device certificate (MIT OR Apache-2.0).
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
# Pairing proofs (MIT OR Apache-2.0); 0.12 matches sha2 0.10.
hmac = "0.12"
# mDNS discovery (MIT OR Apache-2.0).
mdns-sd = "0.21"
# Local addresses shown for "Add by address" (MIT OR BSD-3-Clause; via mdns-sd).
if-addrs = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

# Cross-platform clipboard for everything that is not macOS (macOS keeps the
# proven NSPasteboard path in commands/clipboard.rs). `image-data` gives us
# the RGBA bitmap for "paste image"; `png` re-encodes it for the asset store.
[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
png = "0.18"


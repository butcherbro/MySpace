[package]
name = "myspace"
version = "0.1.0"
description = "A spatial project surface"
authors = ["you"]
edition = "2021"
default-run = "myspace"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "myspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
uuid = { version = "1.26.0", features = ["v7", "serde", "rng-getrandom"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13.4", features = ["blocking"] }
url = "2.5.8"
# GFM-таблицы для рендера .md-превью (file card) в HTML внутри sandboxed iframe.
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
# Only the pieces the Workspace handle needs: oneshot replies from the writer
# thread and spawn_blocking for pooled reads. Tauri already pulls tokio in.
tokio = { version = "1", features = ["sync", "rt", "macros"] }
# Content hash of every managed asset (P1.2, ADR-0011 §4: blob identity).
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

# Одна версия Rust для локальной сборки и CI: без закрепления CI берёт свежий stable,
# и новые правила clippy ломают гейт на коде, который локально зелёный.
# При обновлении поменять и версию dtolnay/rust-toolchain в .github/workflows.
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]

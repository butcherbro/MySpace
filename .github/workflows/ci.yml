name: CI

# Non-deploying gate: this workflow only proves the tree is green. It never
# signs, packages, publishes or touches a secret, so it is safe to run on every
# pull request and on every push to main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    # macOS is required, not preferred: folder bookmarks and asset paths are
    # built on macOS-only APIs, so their tests cannot run on a Linux runner.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend gates (typecheck, lint, unit tests)
        run: npm run check

      # The Rust build embeds the frontend bundle, so it has to exist before any
      # cargo command runs.
      - name: Build the frontend bundle
        run: npm run build

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end suite
        run: npm run test:e2e

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
